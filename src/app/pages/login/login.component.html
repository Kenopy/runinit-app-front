<div class="min-h-screen flex items-center justify-center lg:justify-end md:p-16 bg-[url('/bgloginruninit.png')] bg-cover bg-center bg-no-repeat">

  <div class="w-full md:w-[80%] lg:w-[30%] lg:min-w-90 flex items-center justify-center px-6 py-12 md:px-10 md:py-20 bg-red-900/10 backdrop-blur-xs md:rounded-4xl">
    <div class="w-full max-w-sm">
    <div class="flex justify-center mb-6">
      <img src="/logoFormRuninit.png" alt="Runinit" class="w-64 h-auto">
    </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5 ">
        <div>
          <label for="email" class="block text-sm font-medium text-white">
            E-mail
          </label>
          <input 
                type="email" 
                id="email" 
                formControlName="email"
                autocomplete="email"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md bg-white/70 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
            <p class="mt-1 text-sm text-red-600">
              Informe um e-mail válido.
            </p>
          }
        </div>

        <div>
          <label for="senha" class="block text-sm font-medium text-white ">
            Senha
          </label>
          <input 
            type="password" 
            id="senha" 
            formControlName="senha"  
            autocomplete="current-password" 
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md bg-white/70 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          @if (loginForm.controls.senha.touched && loginForm.controls.senha.invalid) {
            <p class="mt-1 text-sm text-red-600">
              Informe a senha.
            </p>
          }
        </div>

        @if (erro()) {
          <p class="text-sm text-red-600 text-center">{{ erro() }}</p>
        }

        <button 
          type="submit"       
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-700 hover:bg-red-950 focus:outline-none transition-colors">
          Entrar
        </button>
        
        <div class="flex justify-center flex-col">

          <div class="flex items-center gap-3 mt-8">
            <div class="h-px flex-1 bg-white/40"></div>
            <span class="text-sm text-white/80">ou continue com</span>
            <div class="h-px flex-1 bg-white/40"></div>
          </div>

          <div class="flex items-center justify-center gap-4 mt-4">

            <button type="button" aria-label="Entrar com Google"
                    class="size-12 flex items-center justify-center rounded-full bg-white shadow-sm hover:bg-gray-100 hover:scale-105 cursor-pointer transition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22" height="22">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
            </button>


            <button type="button" aria-label="Entrar com Apple"
                    class="size-12 flex items-center justify-center rounded-full bg-white shadow-sm hover:bg-gray-100 hover:scale-105 cursor-pointer transition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" width="20" height="20" fill="#000">
                <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.13-1.92-14.36-6.13-3.41-2.73-7.39-7.49-11.93-14.28-10.09-15.17-15.14-31.53-15.14-49.06 0-13.88 3.51-24.96 10.53-33.24 7.02-8.27 15.68-12.41 25.98-12.41 4.7 0 9.77 1.24 15.22 3.73 5.46 2.48 9.3 3.73 11.53 3.73 2.11 0 6.13-1.3 12.06-3.89 5.93-2.58 11.08-3.77 15.46-3.57 11.55.77 20.6 5.06 27.13 12.87-14.85 9.01-22.14 21.11-21.87 36.31.27 11.83 4.8 21.72 13.6 29.66 8.8 7.94 19.34 12.3 31.62 13.06-2.59 7.42-6.07 14.12-10.42 20.12zM119.22 19.14c0 7.64-2.74 14.82-8.23 21.56-5.48 6.73-12.1 11.13-19.84 13.18-.92.23-1.81.35-2.68.35-1.12 0-2.12-.22-2.99-.67.45-8.2 3.49-15.71 9.11-22.52 5.62-6.81 12.63-11.37 21.03-13.67.65-.11 1.4-.2 2.24-.26 1.43-.07 2.44.7 3.03 2.3.23.82.33 1.72.33 2.73z"/>
              </svg>
            </button>

            <button type="button" aria-label="Entrar com Facebook"
                    class="size-12 flex items-center justify-center rounded-full bg-white shadow-sm hover:bg-gray-100 hover:scale-105 cursor-pointer transition">
              <i class="fa-brands fa-facebook text-2xl text-blue-600"></i>
            </button>

          </div>
        </div>

        <div class="w-full flex items-center justify-center gap-3 mt-8 ">
            <span class="text-sm text-white/80">Ainda não possui uma conta?</span>
            <a routerLink="/cadastro-usuario" class="text-red-600 underline font-bold hover:text-red-700 lg:hover:scale-105 cursor-pointer">Cadastrar-se</a>
        </div>
      </form>
    </div>
  </div>

</div>
